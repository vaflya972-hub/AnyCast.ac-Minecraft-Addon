name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: AnyCast-Minecraft-Addon
          path: target/AnyCast-Minecraft-Addon-*.jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/AnyCast-Minecraft-Addon-*.jar
          generate_release_notes: true
