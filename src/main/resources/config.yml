# Ключ сервера из панели anycast.ac (Minecraft → сервер → «Сервер»)
key: ""

# Пускать только соединения с адресов anycast.ac
only-anycast: true

# Откуда брать список адресов anycast.ac и как часто обновлять, в минутах
ip-list-url: "https://anycast.ac/ips/minecraft.txt"
ip-list-refresh-minutes: 10

# Адреса, которые пускать всегда
allow:
  - 127.0.0.1
  - ::1

# Сколько секунд действует подпись входа. Часы сервера должны быть точными
signature-max-age-seconds: 600

debug: false
