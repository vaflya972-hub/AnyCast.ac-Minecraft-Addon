# Ключ сервера из панели anycast.ac (Minecraft → сервер → «Сервер»).
# Без ключа любой аккаунт anycast.ac может направить свой сервер на ваш адрес и увидеть ваш MOTD
key: ""

# Пускать игроков и напрямую на сервер, мимо anycast.ac, вместе с игроками через anycast.ac.
# Включайте, только если знаете, что делаете: это ослабляет защиту. Прямые игроки идут без
# защиты anycast.ac от DDoS и ботов, баны и запреты стран из панели на них не действуют,
# а адрес сервера становится известен, и его могут атаковать напрямую.
allow-direct: false

# Откуда брать список адресов anycast.ac (только https) и как часто обновлять, в минутах
ip-list-url: "https://anycast.ac/ips/minecraft.txt"
ip-list-refresh-minutes: 10

# Адреса, которые пускать мимо всех проверок, например ваш BungeeCord на другой машине.
# Не добавляйте 127.0.0.1, если на этой машине работает туннель (playit.gg, ngrok, frp):
# тогда через него придут все игроки и обойдут защиту.
allow: []

# Сколько секунд действует подпись входа, от 30 до 600. Часы сервера должны быть точными
signature-max-age-seconds: 120

debug: false
